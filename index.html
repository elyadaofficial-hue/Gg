<style>
:root{--r:16px;}
*{box-sizing:border-box;}
html{margin:0;padding:0;height:100%;}
body{margin:0;padding:0;}
body{
  background:var(--bg);color:var(--ink);
  font-family:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  min-height:100%;
  padding:env(safe-area-inset-top,0) 0 calc(126px + env(safe-area-inset-bottom,0));
  transition:background .35s, color .35s;
  --bg:#12151A;--panel:#1B1F26;--ink:#EDEFF2;--ink-soft:#9AA3AD;--accent:#D9DEE6;--line:rgba(var(--glass),.1);--glass:255,255,255;
}
body::before,body::after{content:'';position:fixed;width:280px;height:280px;border-radius:50%;filter:blur(75px);z-index:0;pointer-events:none;transition:background .35s;}
body::before{background:var(--accent);opacity:.28;top:-70px;inset-inline-end:-70px;}
body::after{background:var(--accent);opacity:.16;bottom:80px;inset-inline-start:-90px;}
body[data-theme="sales"]{--bg:#0A0F1E;--panel:#141B2E;--ink:#E8EFFC;--ink-soft:#93A6C6;--accent:#4CC9F0;--line:rgba(76,201,240,.2);}
body[data-theme="workout"]{--bg:#180F0A;--panel:#241611;--ink:#FDEEE6;--ink-soft:#C79C87;--accent:#FF5C7A;--line:rgba(255,92,122,.2);}
body[data-theme="nutrition"]{--bg:#0E1A10;--panel:#16261A;--ink:#E7F5EA;--ink-soft:#8FB39B;--accent:#06D6A0;--line:rgba(6,214,160,.2);}
body[data-theme="sleep"]{--bg:#100B24;--panel:#1B1440;--ink:#EDE9FB;--ink-soft:#A79BD1;--accent:#9D6BFF;--line:rgba(157,107,255,.22);}
body[data-theme="studies"]{--bg:#12131C;--panel:#1B1D2B;--ink:#EDEDF5;--ink-soft:#9A9BB5;--accent:#FFD166;--line:rgba(255,209,102,.18);}
body[data-theme="content"]{--bg:#1A0E14;--panel:#241620;--ink:#FBE9F0;--ink-soft:#C79AAE;--accent:#FF3DAE;--line:rgba(255,61,174,.2);}
body.light{--bg:#EFEEF6;--ink:#241D3D;--ink-soft:#6E6588;--line:rgba(40,25,80,.12);--glass:20,15,40;}
.wrap{max-width:480px;margin:0 auto;padding:22px 16px;position:relative;z-index:1;}
h1{font-family:'Frank Ruhl Libre',serif;font-weight:900;font-size:26px;margin:4px 0 2px;}
.sub{color:var(--ink-soft);font-size:13px;margin:0 0 20px;}
.quote{font-family:'Frank Ruhl Libre',serif;font-size:16px;line-height:1.5;color:var(--accent);border-right:3px solid var(--accent);padding:4px 12px;margin:0 0 18px;}
.hero{background:linear-gradient(135deg,rgba(var(--glass),.06),rgba(var(--glass),.02));border:1px solid rgba(var(--glass),.1);border-radius:22px;padding:20px;margin-bottom:14px;position:relative;overflow:hidden;}
.hero-scene{position:absolute;inset:0;pointer-events:none;}
.hero-scene svg{width:100%;height:100%;}
.hero h2{font-family:'Frank Ruhl Libre',serif;font-size:22px;margin:0 0 8px;position:relative;}
.hero p{font-size:13.5px;color:var(--ink-soft);margin:0;position:relative;line-height:1.55;max-width:88%;}
.goal-row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;}
.goal-row:first-child{border-top:none;padding-top:4px;}
.gicon{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.gtext{flex:1;min-width:0;}
.gtext b{font-size:13.5px;display:block;}
.gtext span{font-size:11.5px;color:var(--ink-soft);}
.dotsrow{display:flex;gap:4px;margin:8px 0 6px;}
.dotsrow .dot{width:7px;height:7px;border-radius:50%;background:rgba(var(--glass),.12);}
.gtrack{height:5px;background:var(--line);border-radius:4px;overflow:hidden;}
.gfill{height:100%;border-radius:4px;transition:width .5s;}
.gnum{font-size:11.5px;color:var(--ink-soft);white-space:nowrap;padding-top:3px;flex-shrink:0;}
.card{background:rgba(var(--glass),.055);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(var(--glass),.12);box-shadow:0 8px 28px rgba(0,0,0,.28);border-radius:var(--r);padding:16px;margin-bottom:14px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.mini{background:rgba(var(--glass),.05);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(var(--glass),.1);border-radius:12px;padding:12px;cursor:pointer;}
.mini b{display:block;font-size:20px;font-family:'Frank Ruhl Libre',serif;}
.mini span{font-size:12px;color:var(--ink-soft);}
.moodrow{display:flex;gap:8px;justify-content:space-between;margin:10px 0 4px;}
.moodbtn{flex:1;font-size:24px;background:transparent;border:1.5px solid var(--line);border-radius:12px;padding:8px 0;cursor:pointer;}
.moodbtn.on{border-color:var(--accent);background:var(--accent);}
label{font-size:12.5px;color:var(--ink-soft);display:block;margin:0 0 4px;}
input,select,textarea{width:100%;background:rgba(var(--glass),.04);border:1px solid rgba(var(--glass),.14);border-radius:10px;color:var(--ink);font-family:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-size:14.5px;padding:9px 10px;margin-bottom:10px;}
select{color:var(--ink);}
select option{background:#fff;color:#111;}
textarea{min-height:54px;resize:vertical;}
button.add{width:100%;background:var(--accent);color:#0B0B0C;border:none;border-radius:10px;padding:11px;font-weight:700;font-size:14.5px;cursor:pointer;}
.bars{display:flex;align-items:flex-end;gap:6px;margin-top:10px;}
.bar{flex:1;background:var(--accent);border-radius:4px 4px 0 0;opacity:.85;min-height:3px;}
.barday{flex:1;text-align:center;font-size:10px;color:var(--ink-soft);}
.entry{border-top:1px solid var(--line);padding:10px 0;font-size:13.5px;}
.entry .d{color:var(--ink-soft);font-size:11.5px;}
.entry-actions{display:flex;justify-content:flex-end;gap:14px;margin-bottom:3px;}
.entry-actions span{font-size:11.5px;cursor:pointer;font-weight:600;}
.entry select{margin-bottom:0;padding:4px 6px;font-size:13px;width:auto;}
.badge{font-size:11px;color:var(--accent);font-weight:700;margin-bottom:2px;}
.empty{color:var(--ink-soft);font-size:13px;padding:6px 0;}
.targetrow{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
.targetrow input{margin:0;width:90px;}
.progtrack{height:8px;background:var(--line);border-radius:5px;overflow:hidden;margin:6px 0 2px;}
.progfill{height:100%;background:var(--accent);border-radius:5px;transition:width .5s;}
.csvbtn{display:block;text-align:center;border:1.5px dashed var(--line);border-radius:10px;padding:10px;font-size:13px;color:var(--ink-soft);margin-bottom:12px;cursor:pointer;}
.linkbtn{font-size:12.5px;color:var(--accent);cursor:pointer;text-align:center;margin-top:8px;}
.ticker{overflow:hidden;background:rgba(8,9,12,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(var(--glass),.08);white-space:nowrap;padding:7px 0;margin:-22px -16px 18px;}
.ticker-track{display:inline-block;padding-inline-end:100%;animation:tick 30s linear infinite;font-size:12px;color:var(--ink-soft);}
@keyframes tick{from{transform:translateX(0);}to{transform:translateX(-100%);}}
[dir="rtl"] .ticker-track{animation-name:tickr;}
@keyframes tickr{from{transform:translateX(0);}to{transform:translateX(100%);}}
.lockscreen{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:50;}
.lockscreen input{width:170px;text-align:center;font-size:24px;letter-spacing:8px;}
body.locked .lockscreen{display:flex;}
body.locked .wrap,body.locked nav{display:none;}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(13,15,19,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(var(--glass),.1);display:flex;align-items:center;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0));z-index:10;}
.navgrp{flex:1;display:flex;justify-content:space-around;}
nav button{background:none;border:none;color:#8A93A0;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 6px;font-family:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;}
nav button .ic{font-size:18px;}
nav button.home{flex:0 0 auto;}
nav button.home .ic{font-size:24px;background:var(--accent);width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:-22px;box-shadow:0 4px 14px rgba(0,0,0,.4);}
nav button.active{color:var(--accent);}

/* ---- Apple-style refinement layer ---- */
:root{--ease:cubic-bezier(.2,.9,.3,1);}
html{-webkit-text-size-adjust:100%;}
body{line-height:1.45;-webkit-font-smoothing:antialiased;font-optical-sizing:auto;}
body.light{--panel:#FFFFFF;}
/* Typography: tight tracking + leading on large text, balanced wrapping */
h1{letter-spacing:-.02em;line-height:1.1;text-wrap:balance;}
.hero h2{letter-spacing:-.015em;line-height:1.15;text-wrap:balance;}
.hero p,.quote{text-wrap:pretty;}
.mini b,.gnum{letter-spacing:-.01em;font-variant-numeric:tabular-nums;}
/* 16px inputs stop iOS zoom-on-focus; focus feedback is immediate */
input,select,textarea{font-size:16px;transition:border-color .15s,box-shadow .15s;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
/* Response: feedback on press-down, no tap delay */
button,.goal-row,.mini,.moodbtn,.linkbtn,.csvbtn,[onclick],label.add{-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .4s var(--ease),opacity .2s,background-color .2s,border-color .2s;}
button:active,.mini:active,.moodbtn:active,.linkbtn:active,.csvbtn:active,[onclick]:active,label.add:active{transform:scale(.96);transition-duration:.08s;}
.goal-row:active{transform:scale(.985);transition-duration:.08s;}
.moodbtn{min-height:48px;}
.moodbtn.on{transform:scale(1.06);}
.entry-actions span{padding:10px 6px;margin:-10px -2px;}
/* Materials: translucent, theme-tinted chrome with a light-catching top edge */
.card,.mini{box-shadow:0 8px 28px rgba(0,0,0,.26),inset 0 1px 0 rgba(var(--glass),.1);}
body.light .card{box-shadow:0 6px 22px rgba(40,25,80,.1),inset 0 1px 0 rgba(255,255,255,.7);}
nav{background:rgba(18,21,26,.72);background:color-mix(in srgb,var(--panel) 62%,transparent);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-top:1px solid rgba(var(--glass),.14);}
nav button{color:var(--ink-soft);min-height:46px;}
nav button.active{color:var(--accent);font-weight:600;}
.ticker{background:rgba(18,21,26,.6);background:color-mix(in srgb,var(--bg) 55%,transparent);border-bottom:none;-webkit-mask-image:linear-gradient(to bottom,#000 70%,transparent);mask-image:linear-gradient(to bottom,#000 70%,transparent);padding:9px 0 12px;}
/* Undo toast: a material that arrives, interruptible, thumb-sized target */
#undoToast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:6px;padding:4px 4px 4px 18px;border-radius:18px;font-size:14px;color:#fff;z-index:20;background:rgba(28,28,34,.72);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.12);box-shadow:0 12px 32px rgba(0,0,0,.4);transform:translate(-50%,24px) scale(.94);opacity:0;visibility:hidden;pointer-events:none;transition:transform .45s var(--ease),opacity .25s,visibility 0s .45s;}
#undoToast.show{transform:translate(-50%,0) scale(1);opacity:1;visibility:visible;pointer-events:auto;transition-delay:0s;}
#undoToast span{color:#5EEAD4;font-weight:700;cursor:pointer;padding:12px 14px;border-radius:14px;}
/* Accessibility signals */
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important;}
  .ticker{overflow-x:auto;}.ticker-track{animation:none!important;padding-inline-end:0;}
  button:active,.mini:active,.moodbtn:active,[onclick]:active,.goal-row:active{transform:none;opacity:.7;}
  #undoToast{transform:translate(-50%,0);}
}
@media (prefers-reduced-transparency:reduce){
  nav,.ticker,#undoToast{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--panel);}
  .card,.mini{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--panel);}
  body::before,body::after{display:none;}
}
@media (prefers-contrast:more){
  .card,.mini,input,select,textarea{border-color:var(--ink-soft);}
  :root{--r:16px;}.card{background:var(--panel);}
}
details summary{cursor:pointer;font-size:12px;color:var(--ink-soft);padding:6px 0}.warn{color:#FBBF24}
.grid3{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}.grid3 .add{font-size:11.5px;padding:10px 2px}
.gl{--ink:#fff;--ink-soft:rgba(255,255,255,.64);--accent:#A78BFA;--line:rgba(255,255,255,.12);--glass:255,255,255;color:#fff}
body .gl .card,body.light .gl .card,body .gl .hero,body.light .gl .hero{background:linear-gradient(165deg,#3a1d8f 0%,#1b0f4a 48%,#0c0720 100%);border:1.5px solid rgba(167,139,250,.45);border-radius:26px;box-shadow:inset 0 0 40px rgba(124,58,237,.22),0 10px 30px rgba(10,5,30,.45);-webkit-backdrop-filter:none;backdrop-filter:none}
.gl .card{padding:18px 16px}
.gl label{color:#fff;font-weight:700;font-size:14.5px;margin-bottom:8px}
.gl .add{background:rgba(0,0,0,.45);color:#fff;border:1px solid rgba(167,139,250,.4);border-radius:14px}
.gl .add:active{background:rgba(167,139,250,.35)}
.gl input,.gl select,.gl textarea{background:rgba(0,0,0,.4);border:1px solid rgba(167,139,250,.3);border-radius:14px;color:#fff}
.gl select option{background:#1b0f4a;color:#fff}
.gl .moodbtn{border-color:rgba(167,139,250,.35);background:rgba(0,0,0,.35);border-radius:16px}
.gl .moodbtn.on{background:#7C3AED;border-color:#C4B5FD;box-shadow:0 0 14px rgba(124,58,237,.7)}
.gl .linkbtn{color:#C4B5FD}.gl .warn{color:#FCD34D}
.pill{display:inline-block;background:rgba(0,0,0,.45);padding:7px 13px;border-radius:14px;font-size:13px;margin:0 0 6px 6px}
.ldot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:6px}
body[data-theme="home"],body.light[data-theme="home"]{--bg:#0c0720;--panel:#1b0f4a;--ink:#fff;--ink-soft:rgba(255,255,255,.64);--accent:#A78BFA;--line:rgba(167,139,250,.22);--glass:255,255,255;background:radial-gradient(120% 55% at 15% 0%,#3a1d8f 0%,transparent 62%),radial-gradient(90% 45% at 100% 38%,#45219f 0%,transparent 58%),linear-gradient(180deg,#1b0f4a 0%,#0c0720 58%,#07040f 100%);background-attachment:fixed;background-color:#0c0720}


/* ===== v9.2: Home refinement + weekly review ===== */
body .gl .card,body.light .gl .card,body .gl .hero,body.light .gl .hero{background:linear-gradient(180deg,rgba(167,139,250,.10),rgba(167,139,250,.04));border:1px solid rgba(196,181,253,.16);border-radius:22px;box-shadow:0 8px 24px rgba(8,4,24,.4),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);}
.gl .card{padding:16px;margin-bottom:12px}
.gl label{font-size:13px;font-weight:600;letter-spacing:0;color:rgba(255,255,255,.92);margin-bottom:8px}
.gl .pill{background:rgba(167,139,250,.14);border:1px solid rgba(196,181,253,.14);border-radius:12px;font-size:13px}
.gl .grid3{grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.gl .grid3 .add,.gl .add{background:rgba(167,139,250,.12);border:1px solid rgba(196,181,253,.2);border-radius:14px;min-height:44px;font-size:13.5px;font-weight:600}
.gl input,.gl select,.gl textarea{background:rgba(8,4,24,.35);border:1px solid rgba(196,181,253,.2);border-radius:12px}
.gl textarea{min-height:84px;line-height:1.55;font-size:15px}
.wk-nav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.wk-nav .add{width:auto;min-width:44px;padding:0 14px;margin:0}
.wk-nav .wk-t{flex:1;text-align:center;font-size:14px;font-weight:600}
.wk-sub{font-size:12px;color:var(--ink-soft);margin:-2px 0 8px;line-height:1.45}
.wk-ok{font-size:11.5px;color:#C4B5FD;min-height:16px}


.nu-tot{display:flex;gap:8px;flex-wrap:wrap}.nu-tot>div{flex:1 1 70px;background:rgba(var(--glass),.06);border-radius:14px;padding:10px 6px;text-align:center}.nu-tot b{display:block;font-size:20px}.nu-tot span{font-size:11.5px;color:var(--ink-soft)}
.nu-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.nu-chip{min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);font-size:12.5px;display:inline-flex;align-items:center;cursor:pointer;color:var(--ink-soft)}.nu-chip.on{background:var(--accent);color:#0B0B0C;border-color:var(--accent);font-weight:700}
.nu-out{font-size:14px;margin:8px 0;min-height:22px;color:var(--accent);font-weight:600}.nu-g5{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}

/* ===== Refinement layer ===== */
:root{--spring:cubic-bezier(.32,.72,0,1);--tap:44px;}
body{font-size:15px;line-height:1.5;}
h1{font-size:28px;letter-spacing:-.015em;margin:8px 0 4px;}
.sub{font-size:13.5px;line-height:1.55;max-width:34em;}
/* Touch targets: 44px minimum, 8px+ between */
button,select,input:not([type=checkbox]),.linkbtn,.csvbtn,label.add,summary{min-height:var(--tap);}
button.add,label.add{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:14px;}
.entry-actions span,.goal-row,.mini{min-height:var(--tap);}
.entry-actions span{display:inline-flex;align-items:center;padding:0 10px;margin:0;}
summary{display:flex;align-items:center;cursor:pointer;}
nav{padding-top:6px;}
nav button{min-width:52px;min-height:52px;font-size:11.5px;border-radius:14px;justify-content:center;}
nav button.active:not(.home)::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--accent);margin-top:1px;}
/* Readable small text: nothing under 12px */
.barday,.gnum,.d,.entry .d,.badge{font-size:12px;}
span[style*="font-size:11px"],div[style*="font-size:11px"],div[style*="font-size:11.5px"],span[style*="font-size:11.5px"],div[style*="font-size:10.5px"],span[style*="font-size:10.5px"]{font-size:12px!important;}
/* Materials: thicker for bigger surfaces, light-catching top edge */
.card{border-radius:20px;padding:18px;backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);}
.mini{border-radius:16px;}
.hero{border-radius:26px;padding:24px 22px;}
.hero h2{font-size:26px;}
/* Spring response: instant press-down, settle with a critically damped curve */
button,.goal-row,.mini,.moodbtn,.linkbtn,.csvbtn,[onclick],label.add,summary{transition:transform .45s var(--spring),opacity .2s,background-color .2s,border-color .2s;}
button:active,.mini:active,.moodbtn:active,[onclick]:active,label.add:active{transform:scale(.96);transition-duration:.07s;}
.moodbtn.on{transform:scale(1.06);}
.gfill,.progfill{transition:width .6s var(--spring);}
/* Focus: always visible for keyboard users */
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px;}
/* Scroll edge instead of a hard rule above the nav */
nav{border-top:none;box-shadow:0 -1px 0 rgba(var(--glass),.08);}
body::after{display:none;}
/* Light mode: darker accent for text on white surfaces (contrast 4.5:1) */
body.light .badge,body.light .linkbtn,body.light nav button.active,body.light .quote{color:color-mix(in srgb,var(--accent) 45%,#1a1030);}
body.light .quote{border-color:var(--accent);}
body.light nav{background:color-mix(in srgb,#fff 72%,transparent);}
body.light .card{background:rgba(255,255,255,.72);}
@media (prefers-reduced-motion:reduce){
  button:active,.mini:active,.moodbtn:active,[onclick]:active,label.add:active{transform:none;opacity:.7;}
  .moodbtn.on{transform:none;}
}

<script>
const STORAGE_KEY='life-dashboard-v2';
let state={mood:{},notes:{},targets:{nutrition:2800},milestones:{},reminders:[],sales:{sessions:[],roleplays:[],outreach:[]},entries:{sales:[],workout:[],nutrition:[],sleep:[],studies:[],content:[]}};
const TABS={
 sales:{label:'מכירות',emoji:'💼'},
 workout:{label:'אימונים',emoji:'🏋️',csv:true,csvLabel:'📥 ייבוא מ-Strong (CSV)',fields:[

   {k:'title',l:'שם האימון (ל-Other)',t:'text'},

 nutrition:{label:'תזונה',emoji:'🥗',target:'calories',fields:[

   {k:'calories',l:'קלוריות',t:'number'},
   {k:'protein',l:'חלבון (גרם)',t:'number'},
   {k:'carbs',l:'פחמימות (גרם)',t:'number'},{k:'fat',l:'שומן (גרם)',t:'number'},{k:'cholesterol',l:'כולסטרול (מ"ג)',t:'number'}]},
 sleep:{label:'שינה',emoji:'💤',csv:true,csvLabel:'📥 ייבוא מ-Sleep Cycle (CSV)',fields:[
   {k:'bed',l:'שעת השינה',t:'time'},
   {k:'wake',l:'שעת היקיצה',t:'time'},
   {k:'hours',l:'שעות שינה (מחושב אוטומטית)',t:'number'},
   {k:'quality',l:'איכות',t:'select',o:['טובה','בינונית','גרועה']},
   {k:'note',l:'הערות',t:'textarea'}]},
 studies:{label:'לימודים',emoji:'📚',fields:[
   {k:'subject',l:'מקצוע',t:'select',o:['מתמטיקה','אנגלית','אחר']},
   {k:'minutes',l:'זמן למידה (דקות)',t:'number'},
   {k:'note',l:'מה עשיתי / תרגלתי',t:'textarea'}]},
 content:{label:'תוכן',emoji:'🎬',milestone:{key:'subs',label:'מנויים ביוטיוב',goal:1000},fields:[
   {k:'type',l:'סוג',t:'select',o:['סרטון יוטיוב','פוסט אינסטגרם','עריכה/תרגול']},
   {k:'title',l:'נושא/כותרת',t:'text'},

   {k:'note',l:'הערות',t:'textarea'}]}
};
const SIDE_A=['sales','studies','content'], SIDE_B=['workout','nutrition','sleep'];
const RING_COLORS={sales:'#4CC9F0',workout:'#FF5C7A',nutrition:'#06D6A0',sleep:'#9D6BFF',studies:'#FFD166',content:'#FF3DAE'};
let enterNext=true, active='home', formType={}, editingId=null, historyOpen={}, monthlyOpen=false, dayView=null, formDate={}, calOff={};
const QUOTES=['התמדה קטנה כל יום מנצחת מוטיבציה גדולה של יום אחד.','אתה לא צריך להרגיש מוכן כדי להתחיל.','ההתקדמות לא חייבת להיראות מרשימה כדי להיות אמיתית.','מה שאתה עושה השבוע חשוב יותר ממה שאתה מתכנן לעשות מתישהו.','משמעת היא לבחור בין מה שאתה רוצה עכשיו למה שאתה רוצה הכי הרבה.','כל שיחה, כל אימון, כל דף - עוד לבנה בבניין.','אל תשווה את היום שלך ליעד השנתי. תשווה אותו לאתמול.','תוכנית טובה שמבוצעת היום עדיפה על תוכנית מושלמת שלעולם לא מתחילה.','מי שמתמיד כשזה משעמם הוא זה שמגיע רחוק כשזה נהיה מעניין.'];
function pickFallbackQuote(){const doy=Math.floor((Date.now()-new Date(new Date().getFullYear(),0,0))/86400000);return QUOTES[doy%QUOTES.length];}
let quoteText=pickFallbackQuote(), quoteAuthor='';
const USER_NAME='אלידע';
function getGreeting(){const h=new Date().getHours();if(h<5)return 'לילה טוב';if(h<12)return 'בוקר טוב';if(h<17)return 'צהריים טובים';if(h<21)return 'ערב טוב';return 'לילה טוב';}
function heroScene(){
  const h=new Date().getHours(), isDay=h>=6&&h<18, glow=isDay?'#FFD166':'#C9D6FF';
  return `<svg viewBox="0 0 300 130" preserveAspectRatio="xMidYMid slice"><defs><radialGradient id="sunGlow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="${glow}" stop-opacity="0.85"/><stop offset="100%" stop-color="${glow}" stop-opacity="0"/></radialGradient></defs><circle cx="235" cy="38" r="46" fill="url(#sunGlow)"/><circle cx="235" cy="38" r="15" fill="${glow}"/><path d="M0 100 Q60 62 130 96 T300 82 V130 H0 Z" fill="rgba(0,0,0,.32)"/><path d="M0 116 Q90 88 180 110 T300 102 V130 H0 Z" fill="rgba(0,0,0,.45)"/></svg>`;
}

const REDUCED=matchMedia('(prefers-reduced-motion: reduce)');
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms||8);}catch(e){}}
document.addEventListener('touchstart',function(){},{passive:true}); // enables instant :active on iOS
function setThemeColor(l){const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=l?'#EFEEF6':'#12151A';}
const EASE='cubic-bezier(.2,.9,.3,1)';
function playEnter(){
  if(!enterNext)return; enterNext=false;
  const app=document.getElementById('app'); if(!app)return;
  if(REDUCED.matches){app.animate([{opacity:0},{opacity:1}],{duration:180});return;}
  // content arrives from the same place every time; transform + opacity only
  [...app.children].slice(0,14).forEach((el,i)=>el.animate([{opacity:0,transform:'translateY(14px) scale(.985)'},{opacity:1,transform:'none'}],{duration:480,delay:Math.min(i,8)*35,easing:EASE,fill:'backwards'}));
  app.querySelectorAll('.gfill,.progfill').forEach(el=>{const w=el.style.width;el.animate([{width:'0%'},{width:w}],{duration:700,delay:180,easing:EASE,fill:'backwards'});});
  app.querySelectorAll('svg circle[stroke-dasharray]').forEach((c,i)=>{const o=c.getAttribute('stroke-dashoffset'),f=c.getAttribute('stroke-dasharray');c.animate([{strokeDashoffset:f},{strokeDashoffset:o}],{duration:900,delay:200+i*70,easing:EASE,fill:'backwards'});});
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function todayStr(){return ymd(new Date());}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
let storageState='ok',saveWarned=false;
function keepCorrupt(raw){try{localStorage.setItem('life-dashboard-corrupt-'+Date.now(),raw);}catch(e){}}
function load(){let raw=null;
  try{raw=localStorage.getItem(STORAGE_KEY);}catch(e){storageState='unavailable';state=normalize(state);return;}
  try{if(raw){const p=JSON.parse(raw);if((p.v||0)<4)snapshot('pre-migration',raw);state=normalize(p);}else state=normalize(state);}
  catch(e){console.error(e);if(raw)keepCorrupt(raw);storageState='corrupt';state=normalize(state);}
}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));saveWarned=false;return true;}
  catch(e){console.error(e);if(!saveWarned){saveWarned=true;toast('השמירה נכשלה: האחסון מלא או חסום. ייצא גיבוי עכשיו.',{sticky:true});}return false;}}
function last7(){const a=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);a.push(ymd(d));}return a;}
function last30(){const a=[];for(let i=29;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);a.push(ymd(d));}return a;}
function weekday(ds){return ['א','ב','ג','ד','ה','ו','ש'][new Date(ds).getDay()];}
function datesFor(tabId){return tabId==='sales'?[...state.sales.sessions.map(s=>s.date),...state.sales.roleplays.map(r=>r.date)]:state.entries[tabId].map(e=>e.date);}
function prevWorkday(d){const x=new Date(d);x.setDate(x.getDate()-1);while(x.getDay()===5||x.getDay()===6)x.setDate(x.getDate()-1);return x;}
function streak(tabId){
  const active=new Set(datesFor(tabId));
  const todayStr0=todayStr();
  let cur=new Date(); cur.setHours(0,0,0,0);
  while(cur.getDay()===5||cur.getDay()===6)cur.setDate(cur.getDate()-1);
  let s=0, first=true;
  while(true){
    const ds=ymd(cur);
    if(active.has(ds)){ s++; cur=prevWorkday(cur); first=false; }
    else if(first&&ds===todayStr0){ cur=prevWorkday(cur); first=false; }
    else break;
  }
  return s;
}
function navBtn(id){
  if(id==='home')return `<button class="home ${active==='home'?'active':''}" onclick="goTo('home')"><span class="ic">🏠</span></button>`;
  const t=TABS[id];
  return `<button class="${active===id?'active':''}" onclick="goTo('${id}')"><span class="ic">${t.emoji}</span>${t.label}</button>`;
}
function renderNav(){
  document.getElementById('nav').innerHTML=
    `<div class="navgrp">${SIDE_A.map(navBtn).join('')}</div>${navBtn('home')}<div class="navgrp">${SIDE_B.map(navBtn).join('')}</div>`;
}
function goTo(id){active=id;editingId=null;nuDay=false;enterNext=true;document.body.dataset.theme=(id==='weekly'?'home':id);window.scrollTo({top:0});render();}
function fieldInput(f){
  if(f.t==='select')return `<label>${f.l}</label><select id="f_${f.k}"><option value="">--</option>${f.o.map(o=>`<option>${o}</option>`).join('')}</select>`;
  if(f.t==='textarea')return `<label>${f.l}</label><textarea id="f_${f.k}"></textarea>`;
  return `<label>${f.l}</label><input id="f_${f.k}" type="${f.t}">`;
}
function currentFields(t,tabId){return t.typed ? t.typeFields[formType[tabId]] : t.fields;}
function addEntry(tabId){
  const t=TABS[tabId];
  const fields=currentFields(t,tabId);
  const vals={}; let hasVal=false;
  fields.forEach(f=>{const el=document.getElementById('f_'+f.k);if(!el)return;const v=el.value;if(v)hasVal=true;vals[f.k]=v;});
  if(!hasVal){alert('מלא לפחות שדה אחד');return;}
  const fdate=(document.getElementById('f_date')||{}).value||todayStr();
  if(fdate>todayStr()){alert('אי אפשר לתעד תאריך עתידי');return;}
  if(editingId){
    const e=state.entries[tabId].find(x=>x.id===editingId);
    if(e){Object.assign(e,vals);e.date=fdate;if(t.typed)e.type=formType[tabId];}
    editingId=null;
  }else{
    const e={id:uid(),date:fdate,...vals};
    if(t.typed)e.type=formType[tabId];
    state.entries[tabId].unshift(e);
  }
  formDate[tabId]=null;if(historyOpen[tabId])dayView={tab:tabId,ds:fdate};buzz(10);save();render();toast('נשמר');
}
function startEdit(tabId,id){
  const t=TABS[tabId];
  const e=state.entries[tabId].find(x=>x.id===id); if(!e)return;
  if(t.typed)formType[tabId]=e.type;
  editingId=id;
  render();
  currentFields(t,tabId).forEach(f=>{const el=document.getElementById('f_'+f.k);if(el&&e[f.k]!==undefined)el.value=e[f.k];});
  const di=document.getElementById('f_date');if(di){di.value=e.date;di.scrollIntoView({block:'center'});}
  syncWorkoutForm();
}
function cancelEdit(){editingId=null;render();}
let lastDeleted=null, undoTimer=null;
function showUndoToast(){
  clearTimeout(undoTimer);
  const t=document.getElementById('undoToast'); if(t)t.classList.add('show');
  undoTimer=setTimeout(()=>{lastDeleted=null;hideUndoToast();},5000);
}
function hideUndoToast(){const t=document.getElementById('undoToast'); if(t)t.classList.remove('show');}
function undoDelete(){
  if(!lastDeleted)return;
  if(lastDeleted.type==='entries')state.entries[lastDeleted.tabId].splice(lastDeleted.idx,0,lastDeleted.item);
  else state.sales[lastDeleted.kind].splice(lastDeleted.idx,0,lastDeleted.item);
  lastDeleted=null; clearTimeout(undoTimer); hideUndoToast(); buzz(6); save(); render();
}
function delEntry(tabId,id){
  const idx=state.entries[tabId].findIndex(e=>e.id===id); if(idx<0)return;
  lastDeleted={type:'entries',tabId,item:state.entries[tabId][idx],idx};
  state.entries[tabId]=state.entries[tabId].filter(e=>e.id!==id);
  save();render();showUndoToast();
}
function updateField(tabId,id,key,val){const e=state.entries[tabId].find(x=>x.id===id);if(e){e[key]=val;save();}}
function renderBars(tabId,h,showDays){
  h=h||70;
  const t=TABS[tabId], days=last7();
  const vals=days.map(d=>{
    if(tabId==='sales')return datesFor('sales').filter(x=>x===d).length;
    const es=state.entries[tabId].filter(e=>e.date===d);
    if(t.target)return es.reduce((s,e)=>s+(Number(e[t.target])||0),0);
    return es.length;
  });

function computeInsights(){

  const insights=[];

  if(sleepDays.length>=4){
    let gS=0,gN=0,bS=0,bN=0;
    sleepDays.forEach(sd=>{
      const n=new Date(sd.date); n.setDate(n.getDate()+1);
      const m=state.mood[ymd(n)]; if(!m)return;
      const sc=moodScore[m]||3;
      if(sd.hours>=7){gS+=sc;gN++;}else{bS+=sc;bN++;}
    });
    if(gN>=2&&bN>=2){
      const diff=Math.round(((gS/gN)-(bS/bN))/5*100);

      else if(diff<=-8)insights.push(`שים לב — הימים אחרי שינה קצרה יוצאים עם מצב רוח נמוך יותר`);
    }
  }
  const workoutDays=new Set(state.entries.workout.map(e=>e.date));
  if(workoutDays.size>=4){
    let gS=0,gN=0,bS=0,bN=0;
    [...workoutDays].forEach(d=>{
      const m=state.mood[d]; if(!m)return;
      const sc=moodScore[m]||3; gS+=sc; gN++;
    });
    const allMoodDays=Object.keys(state.mood).filter(d=>!workoutDays.has(d));
    allMoodDays.forEach(d=>{const sc=moodScore[state.mood[d]]||3; bS+=sc; bN++;});
    if(gN>=3&&bN>=3){
      const diff=Math.round(((gS/gN)-(bS/bN))/5*100);
      if(diff>=8)insights.push(`בימים שבהם התאמנת, מצב הרוח שלך גבוה ב-${diff}% בממוצע`);
    }
  }
  if(!insights.length)insights.push('עוד קצת נתונים ותתחילו לראות כאן קשרים מעניינים בין התחומים');

}

function importCsv(tabId,ev){

    try{
      const rows=parseCsv(reader.result);
      if(rows.length<2){toast('הקובץ ריק או בלי שורות נתונים');return;}
      const header=rows[0].map(h=>h.trim().toLowerCase()),col=fn=>header.findIndex(fn);

      else{a=col(h=>h.includes('start'));b=col(h=>h.includes('time')&&h.includes('bed'));}

          state.entries.sleep.unshift({id:uid(),date,hours,quality:'',note:'יובא מ-Sleep Cycle'});
        }

    }catch(e){toast('הקובץ לא נקרא: '+e.message);}
  };
  reader.readAsText(file);
}

const AREA_COLOR={'לימודים':'#FFD166','כושר ושינה':'#FF5C7A','מכירות':'#4CC9F0','פרויקטים':'#FF3DAE','אישי':'#9D6BFF'};
function smoothD(P,top,base){let d='M'+P[0][0]+' '+P[0][1];const cl=v=>Math.min(base,Math.max(top,v));
  for(let i=0;i<P.length-1;i++){const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||p2;
    d+=` C${p1[0]+(p2[0]-p0[0])/6} ${cl(p1[1]+(p2[1]-p0[1])/6)} ${p2[0]-(p3[0]-p1[0])/6} ${cl(p2[1]-(p3[1]-p1[1])/6)} ${p2[0]} ${p2[1]}`;}
  return d;}
function weekLine(){
  const today=todayStr(),ids=vkeys(),sets=ids.map(id=>new Set(datesFor(id)));

  const W=320,H=130,top=34,base=100,mx=Math.max(3,...vals),X=i=>20+i*(W-40)/6,Y=v=>base-(v/mx)*(base-top);
  const P=vals.map((v,i)=>[X(i),Y(v)]),d=smoothD(P,top-4,base),last=P[6],lab=['א','ב','ג','ד','ה','ו','ש'];
  const tbx=Math.min(W-84,last[0]-42);
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;"><defs><linearGradient id="wkg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A78BFA" stop-opacity=".4"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></linearGradient></defs>`;
  [0,1,2].forEach(k=>{const y=base-k*(base-top)/2;svg+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,${k?.08:.18})" stroke-dasharray="${k?'4 5':'0'}"/>`;});
  svg+=`<path d="${d} L${X(6)} ${base} L${X(0)} ${base} Z" fill="url(#wkg)"/><path d="${d}" fill="none" stroke="#A78BFA" stroke-width="2.6" stroke-linecap="round" style="filter:drop-shadow(0 0 5px #A78BFA)"/><line x1="${last[0]}" x2="${last[0]}" y1="${top-6}" y2="${base}" stroke="rgba(255,255,255,.28)" stroke-dasharray="3 4"/><circle cx="${last[0]}" cy="${last[1]}" r="4.5" fill="#A78BFA" stroke="rgba(255,255,255,.9)" stroke-width="1.5"/>`;
  days.forEach((dd,i)=>{svg+=`<text x="${X(i)}" y="${H-8}" font-size="11" text-anchor="middle" fill="rgba(255,255,255,${i===6?.9:.4})">${lab[new Date(dd+'T12:00:00').getDay()]}</text>`;});
  const ty=last[1]-40<2?last[1]+12:last[1]-40;

  return `<div class="card"><label>פעילות 7 ימים</label>${svg}<div style="font-size:11px;color:var(--ink-soft);">כמה תחומים תועדו בכל יום. כמות פעילות, לא ציון.</div></div>`;
}

  const tx=X(sel),ty=Y(data[jj][sel]),tw=single?78:62,tlabel=single?`${data[jj][sel]} ימים`:months[sel].slice(5)+'/'+months[sel].slice(2,4);
  const tbx=Math.min(W-tw-2,Math.max(2,tx-tw/2)),tby=ty-40<2?ty+14:ty-40;

  [0,1,2,3].forEach(k=>{const y=base-k*(base-top)/3;svg+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,${k?0.08:0.18})" stroke-dasharray="${k?'4 5':'0'}"/>`;});
  svg+=`<text x="4" y="${top-8}" font-size="10" fill="rgba(255,255,255,.4)">${mx}</text><line x1="${tx}" x2="${tx}" y1="${top-6}" y2="${base}" stroke="rgba(255,255,255,.28)" stroke-dasharray="3 4"/>`;
  view.forEach((s,j)=>{const d=path(data[j]);

  months.forEach((mo,i)=>{svg+=`<text x="${X(i)}" y="${H-8}" font-size="10" text-anchor="middle" fill="rgba(255,255,255,${i===sel?.9:.4})">${mo.slice(5)}/${mo.slice(2,4)}</text><rect x="${X(i)-step/2}" y="0" width="${step}" height="${H}" fill="transparent" onclick="histMo(${i})" style="cursor:pointer"/>`;});

  const legend=[{id:'all',label:'הכל',color:null}].concat(SER).map(s=>`<span onclick="histSer('${s.id}')" style="display:inline-flex;gap:6px;align-items:center;font-size:13px;white-space:nowrap;cursor:pointer;color:rgba(255,255,255,${hSeries===s.id?1:(s.id==='all'?.55:(hSeries==='all'?.9:.4))});${hSeries===s.id?'font-weight:700;':''}">${s.color?`<i style="width:14px;height:14px;border-radius:50%;background:${s.color};box-shadow:0 0 8px ${s.color};display:inline-block;"></i>`:''}${s.label}</span>`).join('');

const NU=[['calories','קלוריות','קק"ל'],['protein','חלבון','ג׳'],['carbs','פחמימות','ג׳'],['fat','שומן','ג׳'],['cholesterol','כולסטרול','מ"ג']];

function nuNum(v){const n=parseFloat(String(v).replace(',','.'));return isFinite(n)&&n>=0?n:null;}

function nuTotals(ds){const tot={};NU.forEach(([k])=>tot[k]=0);state.entries.nutrition.filter(e=>e.date===ds).forEach(e=>NU.forEach(([k])=>{tot[k]+=Number(e[k])||0;}));NU.forEach(([k])=>tot[k]=Math.round(tot[k]*10)/10);return tot;}

function nuCalc(){const f=state.foods.find(x=>x.id===(document.getElementById('nc-food')||{}).value),g=nuNum((document.getElementById('nc-g')||{}).value),o=document.getElementById('nc-out');if(!o)return null;
  if(!f||g==null||g<=0){o.textContent='';return null;}
  const r={};NU.forEach(([k,l,u])=>{r[k]=nuScale(f[NF[k]],g);});
  o.textContent=NU.filter(([k])=>r[k]!=null).map(([k,l,u])=>`${l} ${k==='calories'?Math.round(r[k]):r[k]} ${u}`).join(' · ');return {f,g,r};}

function bcMsg(m){const e=document.getElementById('bc-msg');if(e)e.textContent=m;}
async function bcLookup(code){code=String(code||(document.getElementById('bc-code')||{}).value||'').replace(/\D/g,'');
  if(code.length<8||code.length>14){bcMsg('ברקוד צריך להכיל 8 עד 14 ספרות');return;}

    if(r.status===404){bcMsg('המוצר לא נמצא במאגר. הזן ערכים מהתווית בטופס למטה.');nfDraft={name:'',src:'ברקוד '+code};render();bcMsg('המוצר לא נמצא במאגר. הזן ערכים מהתווית בטופס למטה.');return;}

    if(d.status!==1||!pr){bcMsg('המוצר לא נמצא במאגר. הזן ערכים מהתווית בטופס למטה.');nfDraft={name:'',src:'ברקוד '+code};render();bcMsg('המוצר לא נמצא במאגר. הזן ערכים מהתווית בטופס למטה.');return;}
    const n=pr.nutriments||{},num=x=>x!=null&&isFinite(Number(x))?Math.round(Number(x)*10)/10:null;
    const chol=n.cholesterol_100g!=null&&isFinite(Number(n.cholesterol_100g))?Number(n.cholesterol_100g):null;
    nfDraft={name:[pr.product_name,pr.brands].filter(Boolean).join(' - ')||('ברקוד '+code),cal:num(n['energy-kcal_100g']),p:num(n.proteins_100g),c:num(n.carbohydrates_100g),f:num(n.fat_100g),ch:chol==null?null:Math.round(chol*1000),src:'Open Food Facts '+code};
    nfEdit=null;render();toast('נמצא. בדוק את הערכים ושמור');
  }catch(e){bcMsg('אין חיבור למאגר כרגע. אפשר להזין ידנית מהתווית.');}

async function bcScan(){const v=document.getElementById('bc-vid');if(!v)return;

  try{bcStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=bcStream;v.style.display='block';await v.play();
    const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});
    const tick=async()=>{if(!bcStream)return;try{const r=await det.detect(v);if(r.length){const c=r[0].rawValue;bcStop();const i=document.getElementById('bc-code');if(i)i.value=c;bcLookup(c);return;}}catch(e){}setTimeout(tick,300);};tick();

const NU_NOISE=/^(אכלתי|אכלנו|שתיתי|של|עם|i|ate|had|of|and|ו)$/i;
function nuNorm(s){return String(s).toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();}
function nuMatch(words){if(!words)return null;let best=null,sc=0;state.foods.forEach(f=>{const n=nuNorm(f.name);if(!n)return;let s=0;
  if(words===n)s=1000;else if(words.includes(n))s=500+n.length;else if(n.includes(words))s=200+words.length;else{const nw=n.split(' ');const hit=words.split(' ').filter(w=>w.length>1&&nw.some(x=>x===w||x===w.replace(/^ו/,''))).length;s=hit*50;}
  if(s>sc){sc=s;best=f;}});return sc>=50?best:null;}
async function nuParse(auto){const txt=(document.getElementById('nt-txt')||{}).value||'';if(!txt.trim()){toast('כתוב מה אכלת');return;}
  if(/סיים(?:ו)?\s+את\s+היום|סיום\s+(?:ה)?יום|end\s+(?:the\s+)?day/i.test(txt)){nuDay=true;nuPend=null;render();return;}
  if(!state.foods.length){toast('קודם הוסף מזונות לספרייה');return;}
  const segs=txt.split(/[,;\n]|\s+and\s+|\s+ו(?=\s?\d)|\s+ו(?=[א-ת])/i).map(x=>x.trim()).filter(Boolean),rows=[];
  segs.forEach(sg=>{const m=sg.match(/(\d+(?:[.,]\d+)?)\s*(?:גרם|גר|ג׳|ג'|ג|grams?|gr|g)?/i);const g=m?nuNum(m[1]):null;
    const words=nuNorm(sg.replace(m?m[0]:'','')).split(' ').filter(w=>w&&!NU_NOISE.test(w)).map(w=>w.replace(/^ו(?=.{3,})/,'')).join(' ');
    rows.push({seg:sg,words:words,fid:(nuMatch(words)||{}).id||'',g:g});});
  nuLater=null;let aiFail=false;const un=rows.filter(r=>!r.fid);
  if(un.length&&nuAIOn()){const st=document.getElementById('nt-st');if(st)st.textContent='מחפש ערכים…';
    const res=await nuAiResolve(un.map(r=>r.seg).join('\n'));
    if(res){const keep=rows.filter(r=>r.fid);rows.length=0;keep.forEach(r=>rows.push(r));res.forEach(r=>rows.push(r));}else aiFail=true;}
  const ready=rows.length&&rows.every(r=>r.fid&&r.g>0),aiUsed=rows.some(r=>r.est);
  if(auto&&ready&&!(aiUsed&&state.nutAI.review)){nuPend=null;nuCommitRows(rows);return;}
  nuPend=rows;render();if(aiFail)toast('לא הצלחתי לחשב אוטומטית. אפשר להוסיף ידנית');}
function nuRowCalc(r){const f=state.foods.find(x=>x.id===r.fid);if(!f||!(r.g>0))return '';return NU.filter(([k])=>f[NF[k]]!=null).map(([k,l,u])=>{const v=nuScale(f[NF[k]],r.g);return l+' '+(k==='calories'?Math.round(v):v);}).join(' · ');}
function nuPendHtml(fs){return `<div style="margin-top:10px">${nuPend.some(r=>!r.fid)&&!nuAIOn()?'<div class="wk-sub">כדי שמזונות חדשים יחושבו ויתווספו לבד, חבר AI בכרטיס "חיבור AI" למטה.</div>':''}${nuPend.map((r,i)=>`<div style="border-top:1px solid var(--line);padding:8px 0"><div class="wk-sub" style="margin:0 0 4px">${esc(r.seg)}${r.fid?'':' · לא נמצא בספרייה'}</div><div style="display:flex;gap:6px"><select aria-label="מזון" onchange="nuRow(${i},'fid',this.value)"><option value="">לא להוסיף</option>${fs.map(f=>`<option value="${f.id}" ${f.id===r.fid?'selected':''}>${esc(f.name)}</option>`).join('')}</select><input type="number" inputmode="decimal" style="max-width:96px" aria-label="גרם" value="${r.g==null?'':r.g}" placeholder="גרם" oninput="nuRow(${i},'g',this.value)"></div><div class="nu-out" id="nt-o${i}">${nuRowCalc(r)}</div>${r.fid?'':`<div class="linkbtn" style="text-align:start" onclick="nuNewFood(${i})">הוסף את "${esc(r.words||r.seg)}" לספרייה</div>`}</div>`).join('')}<button class="add" onclick="nuConfirm()">אשר והוסף ליומן</button><div class="linkbtn" onclick="nuPend=null;render()">ביטול</div></div>`;}
function nuRow(i,k,v){const r=nuPend[i];r[k]=k==='g'?nuNum(v):v;const o=document.getElementById('nt-o'+i);if(o)o.textContent=nuRowCalc(r);}
function nuConfirm(){const d=(document.getElementById('f_date')||{}).value||todayStr();if(d>todayStr()){toast('אי אפשר לתעד תאריך עתידי');return;}
  const ok=nuPend.filter(r=>r.fid&&r.g>0);if(!ok.length){toast('אין שורות מוכנות: בחר מזון והזן גרמים');return;}
  ok.forEach(r=>{const f=state.foods.find(x=>x.id===r.fid),e={id:uid(),date:d,time:new Date().toTimeString().slice(0,5),meal:`${f.name} ${r.g}ג׳${(f.ai||r.est)?' (הערכה)':''}`,grams:String(r.g),foodId:f.id};
    NU.forEach(([k])=>{const v=nuScale(f[NF[k]],r.g);if(v!=null)e[k]=String(k==='calories'?Math.round(v):v);});state.entries.nutrition.unshift(e);f.used=(f.used||0)+1;});
  const skipped=nuPend.length-ok.length;nuPend=null;save();buzz(10);render();toast(skipped?`נוספו ${ok.length}, ${skipped} דולגו`:`נוספו ${ok.length} ליומן`);}

let nuRec=null;
function nuSR(){return window.SpeechRecognition||window.webkitSpeechRecognition||null;}
function nuMicUi(on,msg){const b=document.getElementById('nt-mic'),s=document.getElementById('nt-st');if(b){b.textContent=on?'⏹️':'🎤';b.setAttribute('aria-pressed',on?'true':'false');}if(s)s.textContent=msg||'';}
function nuMic(){const SR=nuSR();if(!SR)return;
  if(nuRec){try{nuRec.stop();}catch(e){}return;}
  const ta=document.getElementById('nt-txt');if(!ta)return;const base=ta.value?ta.value.trim()+' ':'';
  let got=false;const r=new SR();r.lang='he-IL';r.interimResults=true;r.continuous=false;r.maxAlternatives=1;nuRec=r;
  r.onstart=()=>nuMicUi(true,'מקשיב… דבר עכשיו');
  r.onresult=ev=>{let s='';for(let i=0;i<ev.results.length;i++)s+=ev.results[i][0].transcript;ta.value=base+s;got=true;};
  r.onerror=ev=>{const m={'not-allowed':'אין הרשאת מיקרופון. אשר אותה בהגדרות הדפדפן.','service-not-allowed':'אין הרשאת מיקרופון. אשר אותה בהגדרות הדפדפן.','no-speech':'לא שמעתי כלום. נסה שוב.','network':'ההכתבה דורשת חיבור לאינטרנט.','audio-capture':'לא נמצא מיקרופון.'};nuMicUi(false,m[ev.error]||'ההכתבה נכשלה. אפשר להקליד או להשתמש במיקרופון במקלדת.');};
  r.onend=()=>{nuRec=null;if(got&&ta.value.trim()){nuParse(true);return;}const s=document.getElementById('nt-st');nuMicUi(false,s&&s.textContent.indexOf('מקשיב')===0?'סיימתי. בדוק את הטקסט ולחץ "פענח"':(s?s.textContent:''));};
  try{r.start();}catch(e){nuRec=null;nuMicUi(false,'לא הצלחתי להפעיל את ההכתבה.');}}


function nuAIOn(){return /^https:\/\/\S+$/.test((state.nutAI&&state.nutAI.url)||'');}
function nuAiClean(it){if(!it||typeof it.name!=='string')return null;const name=it.name.trim().slice(0,60),g=nuNum(it.grams),p=it.per100||{},lim={calories:900,protein:100,carbs:100,fat:100,cholesterol:3000},v={};
  for(const k in lim){const n=p[k]==null?null:nuNum(p[k]);if(n!=null&&n>lim[k])return null;v[k]=n;}
  if(!name||!(g>0)||g>5000||v.calories==null)return null;
  return {name,g:Math.round(g*10)/10,cal:v.calories,p:v.protein,c:v.carbs,f:v.fat,ch:v.cholesterol};}
async function nuAiResolve(text){try{const c=new AbortController(),tm=setTimeout(()=>c.abort(),25000);
  const r=await fetch(state.nutAI.url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text}),signal:c.signal});clearTimeout(tm);
  if(!r.ok)return null;const d=await r.json(),out=[];
  (Array.isArray(d.items)?d.items:[]).forEach(it=>{const x=nuAiClean(it);if(!x)return;let f=state.foods.find(q=>nuNorm(q.name)===nuNorm(x.name));
    if(!f){f={id:uid(),name:x.name,cal:x.cal,p:x.p,c:x.c,f:x.f,ch:x.ch,src:'הערכת AI',ai:true,used:0};state.foods.push(f);}
    out.push({seg:x.name,words:x.name,fid:f.id,g:x.g,est:true});});
  if(out.length)save();return out.length?out:null;}catch(e){return null;}}
function nuAISave(){const url=((document.getElementById('ai-url')||{}).value||'').trim();if(url&&!/^https:\/\/\S+$/.test(url)){toast('הכתובת חייבת להתחיל ב-https://');return;}
  state.nutAI={url,review:!!(document.getElementById('ai-rev')||{}).checked};save();render();toast(url?'חיבור ה-AI נשמר':'חיבור ה-AI כובה');}
function nuAddEntry(f,g,d,est){const e={id:uid(),date:d,time:new Date().toTimeString().slice(0,5),meal:`${f.name} ${g}ג׳${(f.ai||est)?' (הערכה)':''}`,grams:String(g),foodId:f.id};
  NU.forEach(([k])=>{const v=nuScale(f[NF[k]],g);if(v!=null)e[k]=String(k==='calories'?Math.round(v):v);});
  state.entries.nutrition.unshift(e);f.used=(f.used||0)+1;return e;}
function nuCommitRows(rows){const d=(document.getElementById('f_date')||{}).value||todayStr();if(d>todayStr()){toast('אי אפשר לתעד תאריך עתידי');return;}
  rows.forEach(r=>nuAddEntry(state.foods.find(x=>x.id===r.fid),r.g,d,r.est));save();buzz(10);render();toast(rows.length>1?`נוספו ${rows.length} פריטים ליום`:'נוסף ליום');}
function nuUndo(id){const i=state.entries.nutrition.findIndex(e=>e.id===id);if(i<0)return;state.entries.nutrition.splice(i,1);save();render();toast('הרשומה נמחקה');}
function nuNewFood(i){const r=nuPend[i];nuLater={g:r.g,date:(document.getElementById('f_date')||{}).value||todayStr()};nfDraft={name:r.words||r.seg,src:'הוזן ידנית'};nuPend.splice(i,1);if(!nuPend.length)nuPend=null;render();setTimeout(()=>{const el=document.getElementById('nf-cal');if(el)el.scrollIntoView({block:'center'});},30);}
function nuLastHtml(){const e=state.entries.nutrition.find(x=>x.date===todayStr());if(!e)return '';

  return `<div class="card"><label>הרשומה האחרונה</label><div style="font-size:14px;margin-bottom:8px">${esc(e.meal||'')}</div><div class="nu-tot">${cells}</div><div style="display:flex;justify-content:space-between;margin-top:10px"><span class="linkbtn" style="margin:0;color:#F87171" onclick="nuUndo('${e.id}')">מחק</span><span class="linkbtn" style="margin:0" onclick="nuDay=true;render()">סיים את היום</span></div></div>`;}
function nuDayHtml(){const ds=todayStr(),tot=nuTotals(ds),n=state.entries.nutrition.filter(e=>e.date===ds).length;

/* v10.4: quick-fill chips, duplicate last entry, 7-day average (sleep / studies / workout / content) */
const QK={sleep:{k:'hours',vals:[5,6,7,8,9],unit:'שעות'},studies:{k:'minutes',vals:[15,25,45,60],unit:'דקות'},workout:{k:'type',vals:['Push','Pull','Legs','אחריי'],unit:''},content:{k:'minutes',vals:[15,30,60,90],unit:'דקות'}};
function qkSet(k,v){const el=document.getElementById('f_'+k);if(!el)return;el.value=v;try{el.dispatchEvent(new Event('change',{bubbles:true}));}catch(e){}}
function qkLast(tabId){const a=state.entries[tabId]||[];return a.reduce((b,e)=>(!b||e.date>b.date)?e:b,null);}
function qkDup(tabId){const l=qkLast(tabId);if(!l)return;state.entries[tabId].unshift(Object.assign({},l,{id:uid(),date:todayStr()}));try{buzz(10);}catch(e){}save();render();toast('שוכפל להיום');}
function qkAvg(tabId,k){const days=last7(),per={};(state.entries[tabId]||[]).forEach(e=>{const v=Number(e[k]);if(days.includes(e.date)&&isFinite(v)&&e[k]!==''&&e[k]!=null)per[e.date]=(per[e.date]||0)+v;});const ds=Object.keys(per);return ds.length?{avg:ds.reduce((a,d)=>a+per[d],0)/ds.length,n:ds.length}:null;}
function qkHtml(tabId){
  const q=QK[tabId];if(!q||editingId)return '';
  const W=tabId==='workout',ttl=W?'⚡ תיעוד מהיר להיום':'מילוי מהיר';
  let h=`<div class="card"><label>${ttl}</label><div class="qk-chips" role="group" aria-label="${ttl}">`+q.vals.map(v=>`<button class="qk-chip" onclick="${W?`wkQuick('${v}')`:`qkSet('${q.k}','${v}')`}">${v}${q.unit&&q.k!=='type'?' '+q.unit:''}</button>`).join('')+'</div>';

 {id:'phone',t:'להניח את הטלפון בצד: על מטען, רחוק מהמיטה',k:'wind'},

const ER_API='/api/push/';
const erTime=v=>/^([01]\d|2[0-3]):[0-5]\d$/.test(v||'');
function erD(){

  e.s=Object.assign({},ER_DEF,e.s&&typeof e.s==='object'?e.s:{});
  if(!erTime(e.s.time))e.s.time=ER_DEF.time;if(!erTime(e.s.from))e.s.from=ER_DEF.from;
  const rm=Math.round(Number(e.s.repeatMin));e.s.repeatMin=rm>=5&&rm<=120?rm:ER_DEF.repeatMin;e.s.enabled=!!e.s.enabled;e.s.repeat=e.s.repeat!==false;e.s.auto=e.s.auto!==false;
  e.s.quiet=Array.isArray(e.s.quiet)?[...new Set(e.s.quiet.map(Number).filter(n=>Number.isInteger(n)&&n>=0&&n<=6))].sort():[];
  e.off=Array.isArray(e.off)?e.off:[];e.custom=Array.isArray(e.custom)?e.custom.filter(c=>c&&c.id&&c.t):[];e.log=(e.log&&typeof e.log==='object')?e.log:{};
  return e;}
function erActs(k){const d=erD();return ER_ACTIONS.filter(a=>d.off.indexOf(a.id)<0).concat(d.custom.map(c=>({id:c.id,t:c.t,k:'prep',custom:true}))).filter(a=>!k||k.indexOf(a.k)>=0);}

/* ---------- push client ---------- */
let erSt=null,erOb=null,erSyncT=null,erChecked=false;
function erStandalone(){try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true||(document.referrer||'').indexOf('android-app://')===0;}catch(e){return false;}}
const erU8=b=>{const p='='.repeat((4-b.length%4)%4),s=(b+p).replace(/-/g,'+').replace(/_/g,'/'),r=atob(s),o=new Uint8Array(r.length);for(let i=0;i<r.length;i++)o[i]=r.charCodeAt(i);return o;};
function erSyncInfo(){try{return JSON.parse(localStorage.getItem('er-sync')||'null');}catch(e){return null;}}
function erSetSync(ok,msg){try{localStorage.setItem('er-sync',JSON.stringify({ok,msg,at:Date.now()}));if(ok)localStorage.removeItem('er-dirty');else localStorage.setItem('er-dirty','1');}catch(e){}}
async function erReg(){if(!('serviceWorker' in navigator))throw new Error('אין תמיכה ב-Service Worker בדפדפן הזה');
  return Promise.race([navigator.serviceWorker.ready,new Promise((_,rej)=>setTimeout(()=>rej(new Error('ה-Service Worker לא מוכן. נסה לרענן')),8000))]);}

async function erCheck(){
  const s={sw:'serviceWorker' in navigator,push:'PushManager' in window,notif:'Notification' in window,perm:('Notification' in window)?Notification.permission:'unsupported',standalone:erStandalone(),secure:window.isSecureContext,ios:/iPad|iPhone|iPod/.test(navigator.userAgent),sub:false,cfg:null};
  if(s.sw&&s.push){const sub=await erCurSub();s.sub=!!sub;}
  try{const r=await fetch(ER_API+'config',{cache:'no-store'});s.cfg=r.ok?true:(r.status===503?'novapid':false);}catch(e){s.cfg=false;}
  erSt=s;if(active==='resetSettings')render();return s;}

  const reg=await erReg();
  let r;try{r=await fetch(ER_API+'config',{cache:'no-store'});}catch(e){throw new Error('שרת התזכורות לא זמין. האתר צריך להיות מפורסם ב-Netlify עם הפונקציות');}
  if(r.status===503)throw new Error('שרת התזכורות עדיין לא הוגדר (חסרים מפתחות VAPID)');if(!r.ok)throw new Error('שרת התזכורות לא זמין ('+r.status+')');
  const key=erU8((await r.json()).publicKey);let sub=await reg.pushManager.getSubscription();
  if(sub){const cur=sub.options&&sub.options.applicationServerKey?new Uint8Array(sub.options.applicationServerKey):null;
    if(cur&&(cur.length!==key.length||cur.some((v,i)=>v!==key[i]))){await sub.unsubscribe();sub=null;}}
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key});
  return sub;}
function erPayload(sub){const s=erD().s;return {subscription:sub.toJSON(),settings:{enabled:s.enabled,time:s.time,repeat:s.repeat,repeatMin:s.repeatMin,quietDays:s.quiet,reminders:remPayload(),tz:(Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC')}};}
async function erSyncNow(){
  try{const sub=await erCurSub();if(!sub){if(erD().s.enabled||state.remPush)throw new Error('אין מנוי התראות במכשיר');erSetSync(true,'כבוי');return true;}
    const r=await fetch(ER_API+'subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(erPayload(sub))});
    if(!r.ok)throw new Error('השרת החזיר '+r.status);erSetSync(true,'מסונכרן');return true;}
  catch(e){erSetSync(false,String(e&&e.message||e));return false;}finally{if(active==='resetSettings')render();}}

async function erBackgroundSync(){ // on open / back online: repair or refresh quietly
  const d=erD();if(!('Notification' in window))return;
  try{if((d.s.enabled||state.remPush)&&Notification.permission==='granted'){if(!(await erCurSub())){try{await erSubscribe();}catch(e){erSetSync(false,String(e.message));return;}}await erSyncNow();}
    else if(localStorage.getItem('er-dirty')==='1')await erSyncNow();}catch(e){}}
async function erCancel(){try{if(!erD().s.enabled)return;const sub=await erCurSub();if(!sub)return;
  fetch(ER_API+'cancel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({endpoint:sub.endpoint}),keepalive:true}).catch(()=>{});}catch(e){}}
async function erToggle(){
  const d=erD();
  if(d.s.enabled){d.s.enabled=false;save();erQueueSync();render();toast('התזכורות כובו');return;}
  if(!('Notification' in window)||!('PushManager' in window)||!('serviceWorker' in navigator)){await erCheck();toast('הדפדפן הזה לא תומך בהתראות Push');return;}
  if(Notification.permission==='denied'){erOb='denied';render();return;}
  if(Notification.permission==='default'){erOb='ask';render();return;}
  await erEnableNow();}
async function erAsk(){ // only ever called from an explicit tap, only while permission is still 'default'
  if(!('Notification' in window)||Notification.permission!=='default'){erOb=Notification.permission==='denied'?'denied':null;render();return;}
  let p='default';try{p=await Notification.requestPermission();}catch(e){}
  if(p==='granted'){await erEnableNow();return;}
  erOb=p==='denied'?'denied':null;toast(p==='denied'?'ההתראות נחסמו. אפשר לשנות בהגדרות אנדרואיד':'לא אושרו התראות');erCheck();render();}
async function erEnableNow(){
  try{await erSubscribe();const d=erD();d.s.enabled=true;save();const ok=await erSyncNow();toast(ok?'התזכורות פעילות 🌙':'נשמר, אבל הסנכרון עם השרת נכשל. ננסה שוב');}
  catch(e){toast('לא הצלחתי להפעיל: '+(e&&e.message||e),{ms:6000});}
  erOb=null;await erCheck();render();}
function erQuietToggle(i){const d=erD(),q=d.s.quiet,j=q.indexOf(i);if(j<0)q.push(i);else q.splice(j,1);q.sort();save();erQueueSync();render();}
function erSet(k,v){const d=erD();
  if(k==='time'||k==='from'){if(!erTime(v)){toast('שעה לא תקינה');render();return;}d.s[k]=v;}
  else if(k==='repeatMin')d.s.repeatMin=Number(v);else d.s[k]=!!v;
  save();if(k!=='from'&&k!=='auto')erQueueSync();if(k==='repeat'||k==='auto')render();}
async function erTest(){
  try{const sub=await erCurSub();if(!sub){toast('קודם צריך להפעיל תזכורות');return;}
    if(Notification.permission!=='granted'){toast('אין הרשאת התראות');return;}

/* ===== v10.8: body weight + progress photos in the workout tab =====
   Weights: state.bodyWeight {YYYY-MM-DD:{kg,note}} (in the JSON backup). Older weights typed in the workout form also feed the chart.
   Photos: metadata in state.photos [{id,date}] (synced); the images live in IndexedDB and, when signed in, in a private Supabase Storage bucket. */
const BW_MIN=25,BW_MAX=400;
const _normalize9=normalize;
normalize=function(d){
  const s=_normalize9(d),bw={};
  if(s.bodyWeight&&typeof s.bodyWeight==='object'&&!Array.isArray(s.bodyWeight)){
    Object.keys(s.bodyWeight).forEach(k=>{const v=s.bodyWeight[k],kg=Number(v&&v.kg);
      if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&v&&isFinite(kg)&&kg>=BW_MIN&&kg<=BW_MAX)bw[k]={kg:Math.round(kg*10)/10,note:String(v.note||'').slice(0,80)};});
  }
  s.bodyWeight=bw;
  s.photos=(Array.isArray(s.photos)?s.photos:[]).filter(p=>p&&typeof p.id==='string'&&/^[a-z0-9]{1,24}$/i.test(p.id)&&/^\d{4}-\d{2}-\d{2}$/.test(p.date)).map(p=>({id:p.id,date:p.date}));
  return s;
};
(function(){const n=normalize(state);state.bodyWeight=n.bodyWeight;state.photos=n.photos;})();

function bwF(n){return (Math.round(n*10)/10).toFixed(1);}
function bwDate(d,long){return new Date(d+'T12:00:00').toLocaleDateString('he-IL',long?{day:'numeric',month:'long',year:'numeric'}:{day:'numeric',month:'short'});}
function bwSeries(){
  const m={};

  return m;
}
function bwNear(d,m){m=m||bwSeries();if(m[d]!==undefined)return m[d];
  for(let i=1;i<=3;i++){const a=dayAdd(d,-i),b=dayAdd(d,i);if(m[a]!==undefined)return m[a];if(m[b]!==undefined)return m[b];}
  return null;}
function bwStreak(m){let d=todayStr(),n=0;if(m[d]===undefined)d=dayAdd(d,-1);while(m[d]!==undefined){n++;d=dayAdd(d,-1);}return n;}
function bwDelta(m){
  const ks=Object.keys(m).sort();if(ks.length<2)return null;
  const ld=ks[ks.length-1],lim=dayAdd(ld,-7),base=ks.filter(k=>k<=lim).pop()||ks.filter(k=>k>lim&&k<ld)[0];

let bwEditing=false;

function bwSmooth(a){
  if(a.length<2)return '';
  let d='M'+a[0].x.toFixed(1)+' '+a[0].y.toFixed(1);
  for(let i=0;i<a.length-1;i++){
    const p0=a[i-1]||a[i],p1=a[i],p2=a[i+1],p3=a[i+2]||p2,t=.18;
    const lo=Math.min(p1.y,p2.y),hi=Math.max(p1.y,p2.y),cl=v=>Math.min(hi,Math.max(lo,v));
    d+=' C'+(p1.x+(p2.x-p0.x)*t).toFixed(1)+' '+cl(p1.y+(p2.y-p0.y)*t).toFixed(1)+' '+(p2.x-(p3.x-p1.x)*t).toFixed(1)+' '+cl(p2.y-(p3.y-p1.y)*t).toFixed(1)+' '+p2.x.toFixed(1)+' '+p2.y.toFixed(1);
  }
  return d;
}
function bwChart(m){
  const days=last30(),pts=[];
  days.forEach((d,i)=>{if(m[d]!==undefined)pts.push({i,d,v:m[d]});});
  if(!pts.length)return '<div class="bw-empty-chart">עוד אין שקילות ב-30 הימים האחרונים. הוסף את הראשונה למטה.</div>';
  const avg=[];
  days.forEach((d,i)=>{let s=0,c=0;for(let k=0;k<7;k++){const v=m[dayAdd(d,-k)];if(v!==undefined){s+=v;c++;}}if(c)avg.push({i,v:s/c});});
  const vals=pts.map(p=>p.v).concat(avg.map(p=>p.v));
  let lo=Math.min(...vals),hi=Math.max(...vals);if(hi-lo<1){const mid=(hi+lo)/2;lo=mid-.5;hi=mid+.5;}
  const pad=(hi-lo)*.12;lo-=pad;hi+=pad;

  const L=line(pts),area=pts.length>1?L+' L'+x(pts[pts.length-1].i).toFixed(1)+' '+Y1+' L'+x(pts[0].i).toFixed(1)+' '+Y1+' Z':'';
  const now=pts[pts.length-1].i===29;
  const dots=pts.map((p,j)=>j===pts.length-1&&now?'':`<circle class="bw-dot" cx="${x(p.i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3"/>`).join('');
  const last=pts[pts.length-1],lastDot=now?`<circle class="bw-dot-now" cx="${x(last.i).toFixed(1)}" cy="${y(last.v).toFixed(1)}" r="4.5"/>`:'';
  const first=days[0].slice(8)+'/'+days[0].slice(5,7);
  return `<div class="bw-chart"><svg viewBox="0 0 320 134" role="img" aria-label="גרף משקל גוף ב-30 הימים האחרונים"><defs><linearGradient id="bwFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" style="stop-color:var(--accent);stop-opacity:.28"/><stop offset="100%" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs>
  <line class="bw-grid" x1="${X0}" y1="${Y0}" x2="${X1}" y2="${Y0}"/><line class="bw-grid" x1="${X0}" y1="${(Y0+Y1)/2}" x2="${X1}" y2="${(Y0+Y1)/2}"/><line class="bw-grid" x1="${X0}" y1="${Y1}" x2="${X1}" y2="${Y1}"/>
  <text class="bw-tx" x="0" y="${Y0+3}">${bwF(hi-pad)}</text><text class="bw-tx" x="0" y="${Y1+3}">${bwF(lo+pad)}</text>
  <text class="bw-tx" x="${X0}" y="128">${first}</text><text class="bw-tx" x="${X1}" y="128" text-anchor="end">היום</text>
  ${area?`<path class="bw-area" d="${area}"/>`:''}${avg.length>1?`<path class="bw-avg" d="${line(avg)}"/>`:''}${pts.length>1?`<path class="bw-line" d="${L}"/>`:''}${dots}${lastDot}</svg></div>
  <div class="bw-meta">${pts.length} שקילות · 30 ימים אחרונים</div>
  <div class="bw-legend"><span><i></i>יומי</span><span><i class="d"></i>ממוצע 7 ימים</span></div>`;
}

/* ---------- sync ---------- */
function wsMeta(){return wsGet(WS_META,{});}
function wsSnap(){return JSON.parse(JSON.stringify(state));}

function wsMarkDirty(){if(!ws.sess)return;const m=wsMeta();m.dirty=true;wsPut(WS_META,m);wsSchedule(2500);wsPaint();}
function wsSchedule(ms){clearTimeout(ws.timer);ws.timer=setTimeout(()=>wsSync(),ms);}
const _save10=save;
save=function(){const ok=_save10();if(ok&&!ws.applying)wsMarkDirty();return ok;};
function wsRerender(){

  render();
}
async function wsSync(opts){

  if(!navigator.onLine){wsSet('offline');return;}
  if(!opts.force&&!wsMeta().dirty&&Date.now()-ws.last<8000)return;
  ws.busy=true;ws.last=Date.now();wsSet('busy');
  let retried401=false;
  try{
    for(let attempt=0;attempt<5;attempt++){
      try{
        const uid=ws.sess.user.id,rows=await wsRest('GET','/rest/v1/user_data?select=data,version&user_id=eq.'+uid),meta=wsMeta(),local=wsSnap();
        if(!rows.length){

          if(res===409)continue;
          wsApply(local,res[0].version,local);break;
        }
        const row=rows[0];let next;
        if(meta.uid===uid&&meta.ver===row.version){if(!meta.dirty){wsDone(meta.ver);break;}next=local;}
        else if(meta.uid!==uid&&wsEq(local,normalize({})))next=normalize(row.data);   // brand-new device: just take the cloud copy
        else next=normalize(merge3(meta.uid===uid?wsGet(WS_BASE,{}):{},local,row.data));
        next=normalize(next);
        let ver=row.version;
        if(!wsEq(next,row.data)){
          const res=await wsRest('PATCH','/rest/v1/user_data?user_id=eq.'+uid+'&version=eq.'+row.version,{data:next,device:wsDev()},{Prefer:'return=representation'});
          if(!res.length)continue;           // another device saved first: pull and merge again
          ver=res[0].version;
        }

      }catch(e){
        if(e.code===401&&!retried401){retried401=true;if(ws.sess){ws.sess.expires_at=0;wsPut(WS_SESS,ws.sess);}continue;}
        throw e;

    if(e.code==='expired'||e.code==='nosess'){}
    else if(e.code==='net'){wsSet('offline');wsSchedule(30000);}

  }finally{ws.busy=false;}
}
function wsDone(ver){const m=wsMeta();m.ver=ver;m.at=Date.now();m.uid=ws.sess.user.id;wsPut(WS_META,m);ws.at=m.at;wsSet('ok');}
function wsApply(next,ver,localAtStart){
  const nowStr=JSON.stringify(state);let changed=false,editedMeanwhile=nowStr!==JSON.stringify(localAtStart);

  if(editedMeanwhile)target=normalize(merge3(localAtStart,JSON.parse(nowStr),next));   // keep edits made during the request

  wsPut(WS_BASE,next);
  wsPut(WS_META,{uid:ws.sess.user.id,ver,dirty:editedMeanwhile,at:Date.now()});ws.at=Date.now();
  wsSet('ok');
  if(editedMeanwhile)wsSchedule(1500);
  if(changed)wsRerender();
}

/* ---------- photos in a private Storage bucket ---------- */
async function wsStore(method,path,body,ctype){
  const t=await wsToken();

}

  if(!ws.sess)return false;
  try{const r=await wsStore('POST',wsPhPath(id),blob,'image/jpeg');

    const t=await r.text().catch(()=>'');if(r.status===409||/duplicate|already exists/i.test(t)){wsMarkUp(id,true);return true;}

  if(!ws.sess||typeof bwIdbGet!=='function')return;

    if(up.has(p.id)||n>=4)continue;let b=null;try{b=await bwIdbGet(p.id);}catch(e){}

}
